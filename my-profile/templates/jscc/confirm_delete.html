{% extends "base_jscc.html" %}
{% block jscc_title %}Delete{% endblock %}
{% block content %}
<h1 class="h2 mb-4">Delete this item?</h1>
<div class="card" style="max-width: 36rem;">
    <div class="card-body">
        <p>You are about to delete <strong>{{ object }}</strong>. This cannot be undone.</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Yes, delete</button>
            <a href="{{ cancel_url }}" class="btn btn-outline-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
