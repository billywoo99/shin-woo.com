{% extends "base_account.html" %}
{% block title %}Change password - William Woo{% endblock %}
{% block content %}
<h1 class="h4 mb-4">Change password</h1>
<form method="post" novalidate>
    {% csrf_token %}
    {% include "components/form_body.html" with form=form %}
    <button type="submit" class="btn btn-primary w-100">Update password</button>
</form>
<p class="mt-3 mb-0 small text-center"><a href="{% url 'profile' %}">Back to profile</a></p>
{% endblock %}
