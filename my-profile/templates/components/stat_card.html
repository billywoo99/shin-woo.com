{# Usage: {% include "components/stat_card.html" with label="Applications" value=total icon="briefcase" %} #}
<div class="card stat-card h-100">
    <div class="card-body d-flex justify-content-between align-items-start">
        <div>
            <div class="stat-value">{{ value }}</div>
            <div class="stat-label">{{ label }}</div>
        </div>
        {% if icon %}<i class="bi bi-{{ icon }} fs-3 text-primary" aria-hidden="true"></i>{% endif %}
    </div>
</div>
